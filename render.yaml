services:
  - type: web
    name: clinic-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: AUTH_ENABLED
        value: "true"
      - key: AUTH_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Reasoning/text model: triage, differentials, referral letters.
      - key: OPENAI_MODEL
        value: gpt-5.4
      # Chest X-ray vision reads run on their own model.
      - key: OPENAI_VISION_MODEL
        value: gpt-4o-mini
      - key: EXA_API_KEY
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/clinic-dashboard/uploads
