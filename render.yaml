services:
  - type: web
    name: clinic-dashboard-deployment-testing
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: AUTH_ENABLED
        value: "true"
      - key: AUTH_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: EXA_API_KEY
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/clinic-dashboard/uploads
